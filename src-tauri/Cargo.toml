[package]
name = "mpn-studio"
version = "0.3.0"
description = "MPN Studio (Modular Persistent Network) desktop application"
authors = ["Fylume"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mpn_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
